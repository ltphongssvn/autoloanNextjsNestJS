name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --loglevel=error
      - run: cd apps/backend && npx prisma generate 2>&1 | grep -v "deprecated"
      - run: cd apps/backend && npx tsc --noEmit
      - run: cd apps/backend && npx jest --coverage
      - run: cd apps/backend && npx nest build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --loglevel=error
      - uses: actions/cache@v4
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/frontend/src/**') }}
          restore-keys: nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: cd apps/frontend && npx next telemetry disable
      - run: cd apps/frontend && npx eslint --max-warnings=0 src/
      - run: cd apps/frontend && npx vitest run --coverage
      - run: cd apps/frontend && npx next build
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: autoloan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoloan_test  # pragma: allowlist secret
      JWT_SECRET: test-secret-for-ci  # pragma: allowlist secret
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --loglevel=error
      - run: cd apps/backend && npx prisma generate 2>&1 | grep -v "deprecated"
      - run: cd apps/backend && npx prisma migrate deploy 2>&1 | grep -v "deprecated"
      - run: cd apps/backend && npx prisma db seed 2>&1 | grep -v "deprecated"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
